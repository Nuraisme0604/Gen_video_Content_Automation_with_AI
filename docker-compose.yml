# Top-level orchestration: postgres + redis + minio + n8n + python_worker + backend + frontend.
# Phase 1 (infra-only): postgres, redis, minio, n8n, python_worker are runnable.
# backend/frontend are placeholder containers — replace `image:` with `build: ./backend` / `./frontend`
# once those folders are scaffolded.
#
# Usage:
#   cp .env.example .env       # edit values
#   docker compose up -d       # bring up everything
#   docker compose ps          # verify health
#
# NOTE on Postgres 15 → 16: existing video-content-engine/init.sql works on 16. If you have
# existing data in the postgres_data volume from the v15 compose, dump it first:
#   docker run --rm -v video-content-engine_postgres_data:/var/lib/postgresql/data \
#     postgres:15-alpine pg_dumpall -U user > backup.sql
# then start v16 here and `psql < backup.sql` after volume init.

services:
  postgres:
    image: postgres:16-alpine
    container_name: vca_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
      POSTGRES_DB: ${POSTGRES_DB:-content_engine}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./video-content-engine/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-content_engine}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: vca_redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: vca_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # One-shot bucket initialiser. Creates `assets` (private) and `public-thumbnails` (public-read).
  minio_init:
    image: minio/mc:latest
    container_name: vca_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb -p local/assets || true &&
      mc mb -p local/public-thumbnails || true &&
      mc anonymous set download local/public-thumbnails || true &&
      echo 'MinIO buckets ready.'
      "
    restart: "no"

  # One-shot seeder: imports workflows from n8n_workflows/ and activates them on first volume init.
  # Skips on subsequent runs via /home/node/.n8n/.seeded marker (re-runs only after `down -v`).
  n8n_init:
    image: n8nio/n8n:latest
    container_name: vca_n8n_init
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - n8n_data:/home/node/.n8n
      - ./video-content-engine/n8n_workflows:/workflows:ro
    user: node
    entrypoint: /bin/sh
    command:
      - -c
      - |
        if [ -f /home/node/.n8n/.seeded ]; then
          echo "n8n already seeded — skipping (delete /home/node/.n8n/.seeded to re-seed)"
          exit 0
        fi
        echo "Importing workflows..."
        for f in /workflows/01_idea_and_script.json /workflows/02_scene_generation.json /workflows/03_render_and_upload.json; do
          [ -f "$$f" ] && (n8n import:workflow --input="$$f" || echo "WARN: failed to import $$f")
        done
        echo "Activating workflows..."
        for id in $$(n8n list:workflow --onlyId); do
          n8n update:workflow --id="$$id" --active=true || echo "WARN: failed to activate $$id"
        done
        touch /home/node/.n8n/.seeded
        echo "Seeded $$(n8n list:workflow --onlyId | wc -l) workflows"
    restart: "no"

  n8n:
    image: n8nio/n8n:latest
    container_name: vca_n8n
    environment:
      - DB_TYPE=sqlite
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=Asia/Ho_Chi_Minh
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # ── n8n no longer reads API keys from env. Workflow nodes call BE
      #    /api-keys/internal/active to get keys from DB. INTERNAL_API_SECRET
      #    must match BE's value — workflow uses it as X-Internal-Secret header.
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-dev-internal-secret}
      # Pipeline / channel defaults (non-secret config)
      - VIDEO_PROVIDER=${VIDEO_PROVIDER:-slideshow}
      - SCENE_VIDEO_SECONDS=${SCENE_VIDEO_SECONDS:-8}
      - CHANNEL_NAME=${CHANNEL_NAME:-My Channel}
      - CHANNEL_NICHE=${CHANNEL_NICHE:-general}
      - CHANNEL_URL=${CHANNEL_URL:-}
      - CHANNEL_LANGUAGE=${CHANNEL_LANGUAGE:-vi}
      - CHANNEL_VISUAL_STYLE=${CHANNEL_VISUAL_STYLE:-cinematic, 16:9}
      - TARGET_DURATION_MINUTES=${TARGET_DURATION_MINUTES:-10}
      - PIPELINE_MODE=${PIPELINE_MODE:-draft}
      - BACKEND_URL=${BACKEND_URL:-http://backend:3001}
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./video-content-engine/assets_temp:/assets_temp
      - ./video-content-engine/n8n_workflows:/home/node/workflows
    depends_on:
      postgres:
        condition: service_healthy
      n8n_init:
        condition: service_completed_successfully
    restart: unless-stopped

  python_worker:
    build:
      context: ./video-content-engine/worker
      dockerfile: Dockerfile
    container_name: vca_python_worker
    ports:
      - "8000:8000"
    volumes:
      - ./video-content-engine/assets_temp:/assets_temp
      - ./secrets:/secrets:ro
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-pass}@postgres:5432/${POSTGRES_DB:-content_engine}
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - S3_BUCKET_ASSETS=assets
      - S3_BUCKET_PUBLIC=public-thumbnails
      - ASSETS_DIR=/assets_temp
      - MAX_PARALLEL_SCENES=${MAX_PARALLEL_SCENES:-5}
      - PIPELINE_MODE=${PIPELINE_MODE:-draft}
      # ── Worker reads API keys from BE/DB at runtime via INTERNAL_API_SECRET ──
      # No longer hard-coded here. Add keys via UI: http://localhost:3000/api-sources
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-dev-internal-secret}
      # Pipeline tuning (non-secret)
      - VIDEO_PROVIDER=${VIDEO_PROVIDER:-slideshow}
      - VIDEO_MODEL=${VIDEO_MODEL:-}
      - SCENE_VIDEO_SECONDS=${SCENE_VIDEO_SECONDS:-8}
      - VEO3_POLL_TIMEOUT=${VEO3_POLL_TIMEOUT:-300}
      - USE_IMAGE_TO_VIDEO=${USE_IMAGE_TO_VIDEO:-true}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-/secrets/gcp-sa.json}
      # Voice (Edge TTS — free, no key)
      - VOICE_NAME=${VOICE_NAME:-vi-VN-NamMinhNeural}
      # BGM (free fallback to static if no ElevenLabs/Suno key in DB)
      - MUSIC_PROVIDER=${MUSIC_PROVIDER:-static}
      - BGM_DURATION_MS=${BGM_DURATION_MS:-0}
      - BGM_PROMPT=${BGM_PROMPT:-calm ambient background music}
      - BGM_FALLBACK_URL=${BGM_FALLBACK_URL:-https://github.com/rafaelreis-hotmart/Audio-Sample-files/raw/master/sample.mp3}
      # Audio mix
      - VEO_AUDIO_VOLUME=${VEO_AUDIO_VOLUME:-0.3}
      - VOICE_VOLUME=${VOICE_VOLUME:-1.0}
      - BGM_VOLUME=${BGM_VOLUME:-0.15}
      - BGM_CROSSFADE_SEC=${BGM_CROSSFADE_SEC:-2.0}
      # Subtitles
      - BURN_SUBTITLES=${BURN_SUBTITLES:-false}
      - SUBTITLE_STYLE=${SUBTITLE_STYLE:-}
      # YouTube upload — disabled by default; user enables by adding creds via UI later
      - YOUTUBE_PRIVACY_STATUS=${YOUTUBE_PRIVACY_STATUS:-private}
      - YOUTUBE_CATEGORY_ID=${YOUTUBE_CATEGORY_ID:-22}
      - MIN_QA_SCORE=${MIN_QA_SCORE:-75}
      - BUDGET_LIMIT_PER_VIDEO=${BUDGET_LIMIT_PER_VIDEO:-100}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://n8n:5678}
      - BACKEND_URL=${BACKEND_URL:-http://backend:3001}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-pass}@postgres:5432/${POSTGRES_DB:-content_engine}
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - S3_BUCKET_ASSETS=assets
      - S3_BUCKET_PUBLIC=public-thumbnails
      - N8N_BASE_URL=http://n8n:5678
      - PYTHON_WORKER_URL=http://python_worker:8000
      - WEBHOOK_HMAC_SECRET=${WEBHOOK_HMAC_SECRET:-change-me-in-prod}
      - ENCRYPTION_SECRET=${ENCRYPTION_SECRET:-change-me-32-chars-exactly-here!!}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-dev-internal-secret}
      - ENABLE_N8N_RENDER_CALLBACK=${ENABLE_N8N_RENDER_CALLBACK:-false}
      # Telegram credentials are added via UI /notifications/settings → DB
      # (legacy: still falls back to env if user wants headless setup)
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - NEXT_PUBLIC_SOCKET_URL=http://localhost:3001
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  n8n_data:

networks:
  default:
    name: vca_network
